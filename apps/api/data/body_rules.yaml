# Body shape rules and styling recommendations.
# All guidance is neutral, body-positive, and focused on silhouette balance.
# Thresholds and preference weights are the single source of truth for both manual and photo classification.

manual:
  defaults:
    fallback: Rectangle
    confidence: 0.55
  thresholds:
    Hourglass:
      waist_to_hip_max: 0.78
      shoulder_to_hip_min: 0.88
      shoulder_to_hip_max: 1.12
    Pear:
      shoulder_to_hip_max: 0.95
      waist_to_hip_max: 0.80
    Inverted Triangle:
      shoulder_to_hip_min: 1.05
    Rectangle:
      waist_to_hip_min: 0.76
      waist_to_hip_max: 0.89
      shoulder_to_hip_min: 0.88
      shoulder_to_hip_max: 1.12
    Apple:
      waist_to_hip_min: 0.86
      shoulder_to_hip_min: 0.95
  styles:
    Hourglass:
      recommended_silhouettes:
        - "Wrap tops and dresses"
        - "Fitted and semi-fitted waist silhouettes"
        - "V-neck and sweetheart necklines"
        - "A-line and pencil skirts"
        - "Tailored blazers with defined waist"
      suggested_fits:
        - "Tailored fit"
        - "High-rise bottoms"
        - "Belted outerwear"
      styles_to_try:
        - "Classic chic"
        - "Monochrome tailoring"
        - "Fitted ethnic anarkalis and belted sarees"
      notes: "Enhance your natural waist definition with structured lines and balanced proportions."
      recommendations:
        - "More emphasis on V-neck and scoop necklines."
        - "Less emphasis on oversized or boxy fits."
      preferences:
        neckline:
          v_neck: 1.0
          scoop_neck: 0.9
          boat_neck: 0.7
          round_neck: 0.5
        fit:
          tailored: 1.0
          slim: 0.8
          regular: 0.6
          relaxed: 0.4
        length:
          midi: 0.8
          maxi: 0.7
        rise:
          high_rise: 0.9
          mid_rise: 0.7
        subcategory:
          dress: 0.9
          skirt: 0.8
          top: 0.7
    Pear:
      recommended_silhouettes:
        - "Boat-neck, scoop-neck, and statement collar tops"
        - "A-line and skater skirts"
        - "Straight-leg and wide-leg trousers"
        - "Structured shoulders and puff sleeves"
        - "Empire-waist and fit-and-flare dresses"
      suggested_fits:
        - "Regular to relaxed tops with volume at the shoulders"
        - "Clean, flat-front trousers"
        - "High-rise and mid-rise bottoms"
      styles_to_try:
        - "Statement prints on upper garments"
        - "Dark neutral trousers paired with vibrant tops"
        - "A-line kurtas with side slits and straight pants"
      notes: "Balance proportions by adding visual interest and horizontal lines across the shoulder line."
      recommendations:
        - "More emphasis on boat-neck and scoop-neck tops."
        - "Less emphasis on narrow, clingy fits."
      preferences:
        neckline:
          boat_neck: 1.0
          scoop_neck: 0.9
          v_neck: 0.7
          collared: 0.5
        fit:
          regular: 1.0
          relaxed: 0.8
          tailored: 0.6
          slim: 0.4
        length:
          midi: 0.8
          maxi: 0.7
        rise:
          high_rise: 0.9
          mid_rise: 0.8
        subcategory:
          skirt: 0.9
          trousers: 0.8
          dress: 0.7
    Inverted Triangle:
      recommended_silhouettes:
        - "V-neck and scoop necklines to draw focus vertically"
        - "A-line, pleated, and flared skirts"
        - "Wide-leg trousers and cargo pants"
        - "Peplum tops and drop-waist dresses"
        - "Raglan and unpadded sleeve jackets"
      suggested_fits:
        - "Relaxed and flowy bottoms"
        - "Minimalist, unpadded shoulder lines"
        - "Mid-rise trousers"
      styles_to_try:
        - "Bold patterns and colors on bottoms"
        - "Soft drapey tops"
        - "Flared palazzos and lehengas with simple blouses"
      notes: "Create visual harmony by introducing volume and texture at the hips and legs."
      recommendations:
        - "More emphasis on softer necklines and flared hems."
        - "Less emphasis on structured shoulder padding."
      preferences:
        neckline:
          v_neck: 1.0
          scoop_neck: 0.9
          round_neck: 0.5
        fit:
          relaxed: 1.0
          regular: 0.8
          wide_leg: 0.9
          tailored: 0.5
        length:
          midi: 0.8
          maxi: 0.9
        rise:
          mid_rise: 0.8
          low_rise: 0.5
        subcategory:
          trousers: 0.9
          dress: 0.8
          skirt: 0.8
    Rectangle:
