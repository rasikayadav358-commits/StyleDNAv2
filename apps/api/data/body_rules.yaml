      notes: "Create dimension and curves through creative layering, belts, and textured fabrics."
      recommendations:
        - "More emphasis on layered and belted silhouettes."
        - "Less emphasis on flat, straight-across fits."
      preferences:
        neckline:
          boat_neck: 0.8
          scoop_neck: 0.7
          collared: 0.7
        fit:
          regular: 1.0
          tailored: 0.9
          slim: 0.7
          relaxed: 0.6
        length:
          midi: 0.9
          maxi: 0.7
        rise:
          high_rise: 0.9
          mid_rise: 0.8
        subcategory:
          dress: 0.9
          jacket: 0.8
          trousers: 0.7
    Apple:
